name: docs

# runs only when the TT datasheet inputs change
on:
  push:
    paths: ["docs/info.md", "info.yaml", ".github/workflows/docs.yaml"]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ihp-cmos5l
