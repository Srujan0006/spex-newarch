# Classify Magic's "illegal overlap" warnings of a finished newarch_harden run against the macro outlines, on
# GitHub's side (the runs/ artifact does not download reliably to the workstation).
name: newarch_overlaps
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "newarch_harden run id whose newarch-runs artifact to read"
        required: true

jobs:
  overlaps:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: newarch-runs
          path: runs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Classify the overlaps
        run: python3 hardcaml/spex/harden/magic_overlaps.py runs/wokwi
