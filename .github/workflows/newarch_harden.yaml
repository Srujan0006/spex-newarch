# new_arch (Hardcaml SPEX v0.1) at 8x4 (6x4 until the 2026-11-04 freeze): decision option C, 2026-10-24. Hardens hardcaml/spex/harden with the SPEX v1
# spike's layout-A recipe and reports the routing violation count and per-path timing at every corner; LVS, Magic
# stream-out and the Tiny Tapeout precheck run too (2026-10-24).
name: newarch_harden
on:
  workflow_dispatch:
  push:
    branches: [new-arch]
    paths:
      - "hardcaml/spex/harden/**"
      - "!hardcaml/spex/harden/magic_overlaps.py"
      - ".github/workflows/newarch_harden.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use the new_arch harden as the project
        run: |
          rm -rf src
          cp -r hardcaml/spex/harden/src src
          cp hardcaml/spex/harden/info.yaml info.yaml
          cp hardcaml/spex/harden/librelane_plugin_spex_pdn.py hardcaml/spex/harden/odb_stripes.py .

      - name: Build GDS
        uses: ./.github/actions/harden   # tt-gds-action@3412659 steps without the PNG render
        timeout-minutes: 150
        with:
          librelane-version: 3.1.0.dev3

      - name: Per-path timing at each corner
        if: always()
        run: |
          ls runs/wokwi/*detailedrouting*/*.odb > /dev/null 2>&1 || { echo "detailed routing did not finish: no database to time"; exit 0; }
          drc=$(ls runs/wokwi/*detailedrouting*/*.drc 2>/dev/null | tail -1)
          echo "ROUTING VIOLATIONS: $( [ -n "$drc" ] && grep -c 'violation type' "$drc" || echo unknown)"
          grep -h "Effective utilization" runs/wokwi/*floorplan*/*.log 2>/dev/null | tail -1 || true
          for c in slow typ fast; do
            docker run --rm -v "$PWD:$PWD" -v "/home/runner/pdk:/home/runner/pdk" -w "$PWD" \
              -e PDK_ROOT=/home/runner/pdk -e CORNER=$c ghcr.io/librelane/librelane:3.1.0.dev3 \
              openroad -exit -no_splash hardcaml/spex/harden/sta_paths.tcl 2>&1 | tee "sta_paths_$c.rpt" || true
          done
          mkdir -p runs/sta_paths && mv sta_paths_*.rpt runs/sta_paths/ || true

      # 2026-11-13: runs 5 and 6 lost every artifact (and so precheck) to the account's artifact storage quota; the whole
      # run directory was about 250 MB zipped. Keep what the reports and the gate-level replay need: metrics, the final
      # netlists, the step logs and the per-path timing, for 7 days
      - name: Upload the LibreLane metrics, netlists, logs and timing
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: newarch-runs
          path: |
            runs/wokwi/final/metrics.*
            runs/wokwi/final/nl/
            runs/wokwi/final/pnl/
            runs/wokwi/*/*.log
            runs/sta_paths/
          retention-days: 7
          if-no-files-found: warn

      # 2026-11-13: runs 5, 6 and 6b had every upload refused by the account's artifact storage quota (which counts
      # use over the billing month), so the precheck job below never got its tt_submission. Run the same precheck
      # here, on the files in place, and put the results and the routed netlist (gzip + base64) in the job log
      - name: Routed netlist into the log (gzip, base64)
        if: always()
        run: |
          f=$(ls tt_submission/*.v 2>/dev/null | head -1) || true
          [ -n "$f" ] || { echo "no tt_submission netlist"; exit 0; }
          sha256sum "$f"
          echo "=== BEGIN NETLIST $(basename $f).gz.b64"
          gzip -9c "$f" | base64 -w 120
          echo "=== END NETLIST"

      - name: Checkout tt-support-tools for the precheck
        if: always()
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          path: tt_pre
          ref: ihp-sg13cmos5l

      - name: Install precheck dependencies
        if: always()
        working-directory: tt_pre/precheck
        run: pip install -r requirements.txt

      - name: Install Nix
        if: always()
        uses: rikhuijzer/cache-install@c46c673b14b0780c6749d7a45f26ebc07c8c7388  # as tt-gds-action/precheck@3412659
        with:
          key: nix-${{ hashFiles('tt_pre/precheck/default.nix') }}
          nix_file: 'tt_pre/precheck/default.nix'

      - name: Run Tiny Tapeout precheck in this job
        if: always()
        working-directory: tt_pre/precheck
        env:
          PDK: ihp-sg13cmos5l
          PDK_ROOT: /home/runner/pdk
        run: |
          ls $GITHUB_WORKSPACE/tt_submission/*.gds* > /dev/null 2>&1 || { echo "no GDS: harden did not finish"; exit 1; }
          nix-build
          nix-shell --run "python precheck.py --gds $GITHUB_WORKSPACE/tt_submission/*.gds* --tech $PDK" || rc=$?
          cat reports/results.md | tee -a $GITHUB_STEP_SUMMARY || true
          exit ${rc:-0}

  precheck:   # needs the tt_submission artifact; while the quota refuses uploads the gds job's own precheck counts
    needs: gds
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588  # ihp-cmos5l, pinned 2026-10-21
