name: model
# runs only when the Python model or its tests change (pytest + mutation run take 30-50 min of Actions time)
on:
  push:
    paths: ["spex/**", "spec/**", "tests/**", "scripts/**", "pyproject.toml", ".github/workflows/model.yaml"]
  pull_request:
    paths: ["spex/**", "spec/**", "tests/**", "scripts/**", "pyproject.toml", ".github/workflows/model.yaml"]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python3 -B -m pytest -q
      - run: python3 -B scripts/mutate_model.py
